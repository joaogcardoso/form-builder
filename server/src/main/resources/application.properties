spring.application.name=forms-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/forms_api}
spring.datasource.username=${DATASOURCE_USERNAME:${MYSQL_USER:forms_user}}
spring.datasource.password=${DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
